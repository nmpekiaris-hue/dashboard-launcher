plugins { id 'com.android.application' }
android {
    namespace 'gr.mpekiaris.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'gr.mpekiaris.launcher'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '1.4'
    }
    signingConfigs {
        shared {
            // Ίδιο κλειδί σε ΚΑΘΕ build, αλλιώς το κινητό αρνείται την ενημέρωση.
            // Το keystore/dashboard.jks βγαίνει από το κρυπτογραφημένο .enc (δες CLAUDE.md).
            storeFile rootProject.file('keystore/dashboard.jks')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.shared }
        release { signingConfig signingConfigs.shared; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android { testOptions { unitTests { includeAndroidResources = true } } }
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}
